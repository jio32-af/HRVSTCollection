name: ci
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check all Python
        run: python -m compileall -q HRVSTTsp HRVSTNeural HrvstLab
      - name: Ruff (if available)
        run: |
          pip install ruff -q 2>/dev/null && ruff check HRVSTTsp HRVSTNeural HrvstLab || echo "ruff unavailable, py_compile passed"
