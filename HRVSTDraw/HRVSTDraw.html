<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRVSTDraw — two-circle drawing</title>
<style>
  :root{
    --bg:#141210; --panel:#1e1a15; --line:#33291d;
    --ink:#ece5d8; --mut:#a89c88; --acc:#e8a33d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    height:100vh; display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:12px;
    padding:10px 16px; border-bottom:1px solid var(--line);
  }
  header h1{font-size:15px; font-weight:650; margin:0; letter-spacing:.02em}
  header h1 span{color:var(--acc)}
  header p{margin:0; font-size:12px; color:var(--mut)}
  header .sp{flex:1}
  button{
    background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-radius:6px;
    font-size:12.5px; padding:6px 12px; cursor:pointer;
  }
  button:hover{border-color:var(--acc)}
  button.on{background:var(--acc); border-color:var(--acc); color:#141210; font-weight:650}
  button:disabled{opacity:.45; cursor:default}
  main{flex:1; display:flex; min-height:0}
  aside{
    width:228px; flex:none; overflow-y:auto;
    border-right:1px solid var(--line); padding:14px;
    display:flex; flex-direction:column; gap:16px;
  }
  aside h2{font-size:12px; font-weight:650; margin:0 0 8px; color:var(--mut)}
  .row{display:flex; align-items:center; gap:8px; margin:6px 0; font-size:12.5px}
  .row label{flex:1}
  .row output{width:34px; text-align:right; color:var(--acc); font-variant-numeric:tabular-nums}
  input[type=range]{flex:1.4; accent-color:var(--acc)}
  input[type=number]{
    width:52px; background:var(--bg); color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:4px 6px; font-size:12.5px;
  }
  .swatches{display:flex; gap:8px; flex-wrap:wrap}
  .sw{
    width:26px; height:26px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; padding:0;
  }
  .sw.on{border-color:var(--ink)}
  .chips{display:flex; gap:6px; flex-wrap:wrap}
  .chips button{padding:5px 9px; border-radius:20px; font-size:12px}
  .tog{display:flex; gap:6px; flex-wrap:wrap}
  .tog button{font-size:11.5px; padding:5px 8px}
  #stage{flex:1; position:relative; min-width:0; background:#0e0c0a}
  #stage canvas{position:absolute; inset:0; width:100%; height:100%}
  #draw{cursor:crosshair; touch-action:none}
  #badge{
    position:absolute; left:12px; bottom:12px; font-size:12px;
    background:rgba(20,18,16,.85); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; color:var(--mut); pointer-events:none;
  }
  #badge b{color:var(--acc)}
  @media (max-width:760px){ main{flex-direction:column} aside{width:auto; border-right:0; border-bottom:1px solid var(--line)} }
</style>
</head>
<body>
<header>
  <h1>HRVST<span>Draw</span></h1>
  <p>two circles &middot; x(t) from the big one, y(t) from the small one, joined at a right angle</p>
  <div class="sp"></div>
  <button id="saveBtn" type="button">Save PNG</button>
  <button id="clearBtn" type="button">Clear drawing</button>
</header>
<main>
  <aside>
    <section>
      <h2>Pen</h2>
      <div class="swatches" id="swatches"></div>
      <div class="row"><label for="size">Size</label><input id="size" type="range" min="1" max="30" value="4"><output id="sizeOut">4</output></div>
      <div class="row"><button id="eraserBtn" type="button">Eraser: off</button></div>
    </section>
    <section>
      <h2>Circles n1 : n2</h2>
      <div class="row"><label for="n1">Big circle n1</label><input id="n1" type="number" min="1" max="8" step="1" value="3"></div>
      <div class="row"><label for="n2">Small circle n2</label><input id="n2" type="number" min="1" max="8" step="1" value="2"></div>
      <div class="chips" id="presets"></div>
      <div class="row"><button id="traceBtn" type="button">Trace until closed</button></div>
    </section>
    <section>
      <h2>Guide</h2>
      <div class="tog">
        <button id="gCircles" type="button" class="on">Circles</button>
        <button id="gAxes" type="button" class="on">Right angle</button>
        <button id="gCurve" type="button" class="on">Curve</button>
      </div>
      <div class="row"><label for="r2">Small radius</label><input id="r2" type="range" min="30" max="200" value="90"><output id="r2Out">90</output></div>
    </section>
  </aside>
  <div id="stage">
    <canvas id="guide"></canvas>
    <canvas id="anim"></canvas>
    <canvas id="draw"></canvas>
    <div id="badge">pick n1 : n2, then Trace — the pen stops when it lands exactly on its start</div>
  </div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const guideC = $("guide"), animC = $("anim"), drawC = $("draw");
const stage = $("stage"), badge = $("badge");
const g = guideC.getContext("2d"), a = animC.getContext("2d"), d = drawC.getContext("2d");

const S = {
  n1: 3, n2: 2, r2frac: 0.16,
  color: "#f2ede1", size: 4, eraser: false,
  showCircles: true, showAxes: true, showCurve: true,
  tracing: false, traceT: 0, W: 0, H: 0
};
const TAU = Math.PI * 2;

function fit() {
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  S.W = Math.max(50, r.width); S.H = Math.max(50, r.height);
  for (const c of [guideC, animC, drawC]) {
    c.width = Math.round(S.W * dpr); c.height = Math.round(S.H * dpr);
  }
  for (const x of [g, a, d]) x.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawGuideStatic();
}
window.addEventListener("resize", fit);

/* Two-circle harmonograph: A(t) rides the big circle, B(t) the small one.
   The drawing point P(t) = (A.x, B.y): x from the first circle, y from
   the smaller one, joined by lines meeting at a right angle at P. */
function layout() {
  const R1 = Math.min(S.W, S.H) * 0.30;
  const R2 = S.r2frac * Math.min(S.W, S.H);
  return {
    R1, R2,
    o1: { x: S.W * 0.30, y: S.H * 0.46 },
    o2: { x: S.W * 0.64, y: S.H * 0.60 }
  };
}
function pointAt(t) {
  const L = layout();
  const ax = L.o1.x + L.R1 * Math.cos(S.n1 * t);
  const ay = L.o1.y + L.R1 * Math.sin(S.n1 * t);
  const bx = L.o2.x + L.R2 * Math.cos(S.n2 * t);
  const by = L.o2.y + L.R2 * Math.sin(S.n2 * t);
  return { ax, ay, bx, by, px: ax, py: by, L };
}
function say(html) { badge.innerHTML = html; }

function drawGuideStatic() {
  g.clearRect(0, 0, S.W, S.H);
  const L = layout();
  if (S.showCircles) {
    g.strokeStyle = "rgba(232,163,61,.55)"; g.lineWidth = 1.5;
    g.beginPath(); g.arc(L.o1.x, L.o1.y, L.R1, 0, TAU); g.stroke();
    g.strokeStyle = "rgba(126,180,196,.55)";
    g.beginPath(); g.arc(L.o2.x, L.o2.y, L.R2, 0, TAU); g.stroke();
    g.fillStyle = "rgba(236,229,216,.7)";
    g.beginPath(); g.arc(L.o1.x, L.o1.y, 2.5, 0, TAU); g.fill();
    g.beginPath(); g.arc(L.o2.x, L.o2.y, 2.5, 0, TAU); g.fill();
  }
  if (S.showCurve) {
    g.strokeStyle = "rgba(236,229,216,.28)"; g.lineWidth = 1.2;
    g.beginPath();
    for (let k = 0; k <= 720; k++) {
      const p = pointAt(k / 720 * TAU);
      if (k === 0) g.moveTo(p.px, p.py); else g.lineTo(p.px, p.py);
    }
    g.closePath(); g.stroke();
  }
}

const reduced = window.matchMedia &&
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function traceStep() {
  const speed = TAU / (reduced ? 1 : 240);
  const t0 = S.traceT, t1 = Math.min(S.traceT + speed, TAU);
  const p0 = pointAt(t0);
  g.strokeStyle = "#e8a33d"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(p0.px, p0.py);
  const steps = Math.max(2, Math.ceil((t1 - t0) / (TAU / 720)));
  for (let k = 1; k <= steps; k++) {
    const p = pointAt(t0 + (t1 - t0) * k / steps);
    g.lineTo(p.px, p.py);
  }
  g.stroke();
  const p = pointAt(t1);
  a.clearRect(0, 0, S.W, S.H);
  if (S.showAxes) {
    a.strokeStyle = "rgba(236,229,216,.35)"; a.lineWidth = 1;
    a.setLineDash([5, 5]);
    a.beginPath(); a.moveTo(p.ax, p.ay); a.lineTo(p.px, p.py); a.stroke();
    a.beginPath(); a.moveTo(p.bx, p.by); a.lineTo(p.px, p.py); a.stroke();
    a.setLineDash([]);
  }
  a.fillStyle = "#e8a33d";
  a.beginPath(); a.arc(p.ax, p.ay, 4, 0, TAU); a.fill();
  a.fillStyle = "#7eb4c4";
  a.beginPath(); a.arc(p.bx, p.by, 4, 0, TAU); a.fill();
  a.fillStyle = "#f2ede1";
  a.beginPath(); a.arc(p.px, p.py, 4.5, 0, TAU); a.fill();
  S.traceT = t1;
  if (t1 >= TAU) {
    S.tracing = false;
    $("traceBtn").disabled = false;
    a.clearRect(0, 0, S.W, S.H);
    const q = pointAt(0);
    const shut = Math.hypot(q.px - p.px, q.py - p.py);
    say(shut < 1e-6
      ? "n1:n2 = <b>" + S.n1 + ":" + S.n2 + "</b> — pen landed exactly on its start: <b>perfectly the same ✓</b>"
      : "trace finished (gap " + shut.toFixed(2) + "px)");
    return;
  }
  requestAnimationFrame(traceStep);
}
function startTrace() {
  if (S.tracing) return;
  drawGuideStatic();
  a.clearRect(0, 0, S.W, S.H);
  S.traceT = 0; S.tracing = true;
  $("traceBtn").disabled = true;
  say("tracing n1:n2 = <b>" + S.n1 + ":" + S.n2 + "</b> …");
  requestAnimationFrame(traceStep);
}

/* Freehand drawing on the top layer (guide stays untouched beneath). */
let stroking = false, last = null, midPrev = null;
function evPos(e) {
  const r = drawC.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
drawC.addEventListener("pointerdown", e => {
  drawC.setPointerCapture(e.pointerId);
  stroking = true;
  const p = evPos(e);
  last = p; midPrev = p;
  d.lineCap = "round"; d.lineJoin = "round";
  d.strokeStyle = S.eraser ? "rgba(0,0,0,1)" : S.color;
  d.globalCompositeOperation = S.eraser ? "destination-out" : "source-over";
  d.lineWidth = S.size;
  d.beginPath(); d.moveTo(p.x, p.y); d.lineTo(p.x + 0.01, p.y + 0.01); d.stroke();
});
drawC.addEventListener("pointermove", e => {
  if (!stroking) return;
  const p = evPos(e);
  const mx = (last.x + p.x) / 2, my = (last.y + p.y) / 2;
  d.beginPath(); d.moveTo(midPrev.x, midPrev.y);
  d.quadraticCurveTo(last.x, last.y, mx, my); d.stroke();
  last = p; midPrev = { x: mx, y: my };
});
function endStroke() { stroking = false; last = null; midPrev = null; }
drawC.addEventListener("pointerup", endStroke);
drawC.addEventListener("pointercancel", endStroke);

/* Toolbar wiring. */
const COLORS = ["#f2ede1", "#e8a33d", "#7eb4c4", "#c96f4a", "#8fae6b", "#d16a8c"];
const swBox = $("swatches");
COLORS.forEach((c, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "sw" + (i === 0 ? " on" : "");
  b.style.background = c; b.title = c;
  b.setAttribute("aria-label", "pen color " + c);
  b.addEventListener("click", () => {
    S.color = c; S.eraser = false;
    $("eraserBtn").textContent = "Eraser: off";
    swBox.querySelectorAll(".sw").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
  });
  swBox.appendChild(b);
});
$("size").addEventListener("input", e => {
  S.size = +e.target.value; $("sizeOut").textContent = e.target.value;
});
$("eraserBtn").addEventListener("click", () => {
  S.eraser = !S.eraser;
  $("eraserBtn").textContent = "Eraser: " + (S.eraser ? "on" : "off");
  $("eraserBtn").classList.toggle("on", S.eraser);
});
function readRatios() {
  S.n1 = Math.min(8, Math.max(1, Math.round(+$("n1").value || 1)));
  S.n2 = Math.min(8, Math.max(1, Math.round(+$("n2").value || 1)));
  $("n1").value = S.n1; $("n2").value = S.n2;
  drawGuideStatic();
}
$("n1").addEventListener("change", readRatios);
$("n2").addEventListener("change", readRatios);
const PRESETS = [[1, 1], [1, 2], [2, 3], [3, 4], [3, 5]];
const preBox = $("presets");
PRESETS.forEach(([a, b]) => {
  const btn = document.createElement("button");
  btn.type = "button"; btn.textContent = a + ":" + b;
  btn.addEventListener("click", () => {
    S.n1 = a; S.n2 = b; $("n1").value = a; $("n2").value = b;
    drawGuideStatic();
    say("guide n1:n2 = <b>" + a + ":" + b + "</b> — press Trace to watch it close");
  });
  preBox.appendChild(btn);
});
$("r2").addEventListener("input", e => {
  S.r2frac = +e.target.value / Math.max(1, Math.min(S.W, S.H));
  $("r2Out").textContent = e.target.value;
  drawGuideStatic();
});
function tog(id, key) {
  $(id).addEventListener("click", () => {
    S[key] = !S[key];
    $(id).classList.toggle("on", S[key]);
    drawGuideStatic();
  });
}
tog("gCircles", "showCircles");
tog("gAxes", "showAxes");
tog("gCurve", "showCurve");
$("traceBtn").addEventListener("click", startTrace);
$("clearBtn").addEventListener("click", () => {
  d.save(); d.setTransform(1, 0, 0, 1, 0, 0);
  d.clearRect(0, 0, drawC.width, drawC.height); d.restore();
});
$("saveBtn").addEventListener("click", () => {
  const out = document.createElement("canvas");
  out.width = drawC.width; out.height = drawC.height;
  const o = out.getContext("2d");
  o.fillStyle = "#0e0c0a"; o.fillRect(0, 0, out.width, out.height);
  o.drawImage(guideC, 0, 0); o.drawImage(drawC, 0, 0);
  const link = document.createElement("a");
  link.download = "hrvstdraw-n" + S.n1 + "-" + S.n2 + ".png";
  link.href = out.toDataURL("image/png");
  link.click();
});

fit();
</script>
</body>
</html>
